<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b29">
    <title>CASE 001 | サイバー捜査ノベルADV</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="捜査画面トップ">
        <span class="wordmark-icon">C</span>
        <span>CYBER CASE FILES</span>
      </a>
      <div class="case-heading">
        <h1 id="case-title">SNS乗っ取り</h1>
      </div>
      <div class="top-actions">
        <details class="developer-menu">
          <summary class="menu-button" aria-label="メニューを開く"><span></span><span></span><span></span></summary>
          <div class="developer-menu-popover">
            <div class="menu-version"><span class="eyebrow">VERSION</span><strong>UI 試作版</strong><small>本番実装時に削除予定</small></div>
            <a href="./scenario-maker/index.html?source=case001.json">シナリオ編集</a>
            <button id="save-button" type="button">保存</button>
            <button id="reset-button" class="menu-danger" type="button">試作データを削除</button>
          </div>
        </details>
      </div>
    </header>

    <main class="workspace">
      <nav class="side-panel people-panel" aria-label="登場人物">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">PEOPLE</span>
            <h2>登場人物</h2>
          </div>
          <span id="people-count" class="count-pill">0</span>
        </div>
        <div id="people-list" class="list-stack"></div>
        <div class="panel-footnote">人物を選ぶと、捜査メモを確認できます。</div>
      </nav>

      <section class="main-panel" aria-live="polite">
        <div id="detail-view" class="detail-view"></div>
        <section id="dialogue-choices" class="dialogue-choices" hidden aria-label="選択肢"></section>
        <section id="dialogue-pane" class="dialogue-pane" aria-live="polite">
          <div class="dialogue-label">DIALOGUE / 会話</div>
          <div class="dialogue-speaker-row"><span id="dialogue-icon" class="dialogue-icon"></span><div><span id="dialogue-speaker" class="dialogue-speaker"></span><h2 id="dialogue-title"></h2></div></div>
          <p id="dialogue-text" class="dialogue-text"></p>
          <form id="dialogue-answer-form" class="dialogue-answer-form" hidden>
            <label for="dialogue-answer">回答</label>
            <div class="dialogue-answer-row"><input id="dialogue-answer" name="answer" type="text" autocomplete="off"><button class="action-button" type="submit">回答する</button></div>
            <p id="dialogue-answer-feedback" class="dialogue-answer-feedback" role="status" aria-live="polite"></p>
          </form>
          <div id="dialogue-controls" class="dialogue-controls"><button id="dialogue-next" class="action-button" type="button" hidden>次へ</button><button id="dialogue-close" class="reset-button" type="button" hidden>やめる</button><button id="log-analysis-close" class="reset-button" type="button" hidden>解析を終了する</button></div>
        </section>
     </section>

      <nav class="side-panel evidence-panel" aria-label="捜査資料">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">CASE FILES</span>
            <h2>捜査資料</h2>
          </div>
          <span id="evidence-count" class="count-pill">0</span>
        </div>
        <div class="evidence-tabs" role="tablist" aria-label="捜査資料の種類">
          <button class="tab-button is-active" data-tab="evidence" type="button" role="tab" aria-selected="true">証拠品</button>
          <button class="tab-button" data-tab="logs" type="button" role="tab" aria-selected="false">ログ</button>
          <button class="tab-button" data-tab="facts" type="button" role="tab" aria-selected="false">判明事項</button>
        </div>
        <div id="evidence-list" class="list-stack"></div>
        <div class="panel-footnote">証拠品・ログ・判明事項を選ぶと、内容を確認できます。</div>
      </nav>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="inspection-dialog" class="inspection-dialog" aria-labelledby="inspection-title">
      <div class="dialog-topline">EVIDENCE REVIEW / 証拠品調査</div>
      <h2 id="inspection-title">証拠品を調べる</h2>
      <div id="inspection-content"></div>
      <div class="dialog-actions">
        <button id="inspection-close" class="reset-button" type="button">やめる</button>
      </div>
    </dialog>
  </body>
</html>
